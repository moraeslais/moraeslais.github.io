 pt:{back:'← Voltar aos projetos',next:'Próximo caso →',skip:'Pular para o conteúdo',nProj:'Projetos',nAbout:'Sobre',nCv:'Currículo',nContact:'Contato',rights:'Todos os direitos reservados.',toc:'Nesta página',theme:['Mudar para o tema escuro','Mudar para o tema claro'],lang:'Idioma',cv:'cv.html'},

const COVERS={unify:['img/capa-unify.webp','UNI FY'],edu:['img/capa-edu.webp','EduMentor AI'],fixer:['img/capa-fixer.webp','Fixer AI'],venzi:['img/capa-venzi.webp','Venzi'],squad:['img/capa-squad.webp','Squad'],ds:['img/capa-ds.webp','laís.ds']};
const LINKS={proto:'edu/index.html',venziProto:'venzi/index.html',squadProto:'squad/index.html'};
const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const S={get theme(){return root.dataset.theme||(mq.matches?'dark':'light')},lang:(()=>{try{const l=localStorage.getItem('lm-lang');return ['pt','en','es'].includes(l)?l:'pt'}catch(e){return 'pt'}})()};

const m=document.getElementById('main'),toc=document.getElementById('toc');
function view(id){const t=L[S.lang];
 if(id==='edu')return eduView(S.lang,esc,t.back,t.next,LINKS);
 if(id==='fixer')return fixerView(S.lang,esc,t.back,t.next);
 if(id==='venzi')return venziView(S.lang,esc,t.back,t.next,LINKS.venziProto);

 return unifyView(S.lang,esc,t.back,t.next);}
function render(keepScroll){
 const id=(location.hash.replace('#case-','').replace('#','')||'unify');const cid=COVERS[id]?id:'unify';const t=L[S.lang];const y=scrollY;
 m.innerHTML=view(cid);
 const art=m.querySelector('article.case'),w=art.querySelector('.wrap');
 const band=document.createElement('section');band.className='c-hero';
 const hw=document.createElement('div');hw.className='wrap';const left=document.createElement('div');
 const back=document.createElement('a');back.className='back';back.href='index.html#projetos';back.textContent=t.back;left.appendChild(back);
 ['.hud','h1','.sub'].forEach(sel=>{const el=w.querySelector(':scope > '+sel);if(el)left.appendChild(el)});
 const fig=document.createElement('figure');fig.className='c-cover';fig.innerHTML=`<img src="${COVERS[cid][0]}" alt="">`;
 hw.append(left,fig);band.appendChild(hw);m.insertBefore(band,art);
 m.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>location.href='index.html#projetos'));

 if(keepScroll)scrollTo(0,y);else{scrollTo(0,0);if(render.done){const h1=m.querySelector('h1');if(h1){h1.tabIndex=-1;h1.focus({preventScroll:true})}}}

 balance();requestAnimationFrame(balance);

function balance(){const gcd=(a,b)=>b?gcd(b,a%b):a;
 document.querySelectorAll('article.case .wrap *').forEach(g=>{
  if(g.dataset.bal===undefined){const cs=getComputedStyle(g);if(cs.display!=='grid'||g.tagName==='TABLE')return;const k=[...g.children];if(k.length<3||k.some(c=>c.tagName!==k[0].tagName))return;g.dataset.bal=g.style.gridTemplateColumns||''}
  const k=[...g.children];g.style.gridTemplateColumns=g.dataset.bal;k.forEach(c=>c.style.gridColumn='');
  const n=k.length,cols=new Set(k.map(c=>Math.round(c.getBoundingClientRect().left))).size;
  if(g.classList.contains('phones')&&n===4&&innerWidth>700){g.style.gridTemplateColumns='repeat(4,minmax(0,1fr))';return}
  if(cols<2||n%cols===0||n<cols)return;
  for(let c=cols-1;c>=2;c--)if(n%c===0&&n/c<=Math.ceil(n/cols)+1){g.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;return}
  let c=cols,r=n%c;while(r===1&&c>3){c--;r=n%c;if(r===0){g.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;return}}
  if(r===1&&c===2){k[n-1].style.gridColumn='1/-1';return}
  if(r===1){const L=c*2;g.style.gridTemplateColumns=`repeat(${L},minmax(0,1fr))`;k.forEach((x,i)=>x.style.gridColumn=`span ${i>=n-4?c:2}`);return}
  const L=c*r/gcd(c,r);g.style.gridTemplateColumns=`repeat(${L},minmax(0,1fr))`;k.forEach((x,i)=>x.style.gridColumn=`span ${i>=n-r?L/r:L/c}`);
 });}
let balT;addEventListener('resize',()=>{clearTimeout(balT);balT=setTimeout(balance,120)});
function spy(){const links=[...toc.querySelectorAll('a')];let cur=null;links.forEach(a=>{const s=document.getElementById(a.getAttribute('href').slice(1));if(s&&s.getBoundingClientRect().top<140)cur=a});links.forEach(a=>a.classList.toggle('on',a===cur));
 const band=document.querySelector('.c-hero');toc.classList.toggle('show',!!band&&band.getBoundingClientRect().bottom<80);const h=document.documentElement.scrollHeight-innerHeight;document.getElementById('prog').style.width=(h>0?scrollY/h*100:0)+'%';}
addEventListener('scroll',spy,{passive:true});
toc.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));if(el){el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});el.tabIndex=-1;el.focus({preventScroll:true})}});
function chrome(){const t=L[S.lang];root.lang=S.lang==='pt'?'pt-BR':S.lang;
 document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t[el.dataset.t]});
 document.querySelectorAll('[data-cv]').forEach(a=>a.href=t.cv);
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
 document.querySelector('.lang').setAttribute('aria-label',t.lang);paintTheme();}
const tb=document.getElementById('themeBtn');
function paintTheme(){const d=S.theme==='dark';root.classList.toggle('is-dark',d);tb.setAttribute('aria-label',L[S.lang].theme[d?1:0])}
tb.addEventListener('click',()=>{root.dataset.theme=S.theme==='dark'?'light':'dark';try{localStorage.setItem('lm-theme',root.dataset.theme)}catch(e){}paintTheme();render(true)});
mq.addEventListener('change',()=>{paintTheme();render(true)});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.lang;try{localStorage.setItem('lm-lang',S.lang)}catch(e){}chrome();render(true)}));
addEventListener('hashchange',()=>{if(/^#case-/.test(location.hash)||COVERS[location.hash.slice(1)])render(false)});
chrome();render(false);
</script>
