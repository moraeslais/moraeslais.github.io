<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduMentor AI · Protótipo desktop</title>
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body>*{min-width:0}
html,body{margin:0;height:100%}
body{background:#17152E;color:#ECEAF8;font:15px/1.5 Inter,system-ui,sans-serif;display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;overflow:hidden}
:focus-visible{outline:3px solid #C6F432;outline-offset:2px;border-radius:8px}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #2C2950}
header b{font:700 17px Outfit,Inter,sans-serif}
header .sp{flex:1}
header a,header button{color:#ECEAF8;background:#24214A;border:1px solid #3A3670;border-radius:999px;padding:8px 14px;font:600 13px Inter;text-decoration:none;cursor:pointer}
header button[aria-pressed=true]{background:#C6F432;color:#17152E;border-color:#C6F432}
aside{overflow:auto;padding:14px 10px;border-right:1px solid #2C2950}
aside p{font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:#9C98C8;margin:14px 10px 6px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#CFCBEF;padding:8px 10px;border-radius:10px;font:500 14px Inter;cursor:pointer}
aside button:hover{background:#24214A}
aside button[aria-current=true]{background:#4F3CF0;color:#fff}
main{position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:22px}
.browser{width:min(100%,calc((100vh - 140px) * 1.6 + 0px));max-width:1280px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.bar{display:flex;align-items:center;gap:8px;background:#E9E6FF;padding:9px 12px}
.bar i{width:11px;height:11px;border-radius:50%;background:#FF6B57}.bar i:nth-child(2){background:#F5C542}.bar i:nth-child(3){background:#3CC88A}
.bar span{margin-left:10px;flex:1;background:#fff;border-radius:8px;padding:4px 12px;font:500 12px Inter;color:#5B5880}
.view{position:relative;overflow:auto;background:#F6F5FD}
.view.page{max-height:calc(100vh - 150px)}
.stage{position:relative}
.stage img{display:block;width:100%;height:auto}
.hot{position:absolute;border-radius:12px;cursor:pointer;background:transparent;border:0;padding:0}
.hints .hot{background:rgba(198,244,50,.28);outline:2px solid #C6F432;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(198,244,50,.1)}}
.nav{position:fixed;right:22px;bottom:18px;display:flex;gap:8px}
.nav button{background:#24214A;color:#fff;border:1px solid #3A3670;border-radius:999px;padding:10px 16px;font:600 14px Inter;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#C6F432;color:#17152E;font:600 13px Inter;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #2C2950;padding:8px}aside p{display:none}aside button{width:auto;white-space:nowrap}}
@media (prefers-reduced-motion:reduce){.hints .hot{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<header>
 <b>EduMentor AI</b><span id="lbl" style="color:#9C98C8;font-size:13px"></span><span class="sp"></span>
 <button type="button" id="hintBtn" aria-pressed="false"></button>
 <a id="back" href="../case.html#case-edu"></a>
</header>
<aside id="list" aria-label="Telas"></aside>
<main id="main"><div class="browser"><div class="bar" aria-hidden="true"><i></i><i></i><i></i><span id="url"></span></div><div class="view" id="view"><div class="stage" id="stage"></div></div></div></main>
<div class="nav"><button type="button" id="prev"></button><button type="button" id="next"></button></div>
<div class="toast" id="toast" role="status"></div>
<script>
const LANG=(()=>{try{const l=localStorage.getItem('lm-lang');return ['pt','en','es'].includes(l)?l:'pt'}catch(e){return 'pt'}})();
const T={pt:{lbl:'Protótipo desktop · clique nas áreas da tela ou use as setas',hint:'Mostrar áreas clicáveis',back:'← Voltar ao case',prev:'← Anterior',next:'Próxima →',g:['Site','Começo','Estudo','Treino','Conta'],tip:'Dica: as áreas clicáveis piscam em verde',alt:'Tela do EduMentor AI: '},
 en:{lbl:'Desktop prototype · click areas on the screen or use the arrows',hint:'Show clickable areas',back:'← Back to the case',prev:'← Previous',next:'Next →',g:['Website','Getting started','Studying','Practice','Account'],tip:'Tip: clickable areas blink in green',alt:'EduMentor AI screen: '},
 es:{lbl:'Prototipo desktop · haz clic en la pantalla o usa las flechas',hint:'Mostrar áreas clicables',back:'← Volver al caso',prev:'← Anterior',next:'Siguiente →',g:['Sitio','Inicio','Estudio','Práctica','Cuenta'],tip:'Tip: las áreas clicables parpadean en verde',alt:'Pantalla de EduMentor AI: '}}[LANG];
document.documentElement.lang=LANG==='pt'?'pt-BR':LANG;
// screens: id, group, label, image, w, h, url, hotspots [x,y,w,h,target] in px of the original frame
const SIDE=[[24,86,208,48,'home'],[24,142,208,48,'trilha'],[24,198,208,48,'simulados'],[24,254,208,48,'redacao'],[24,310,208,48,'perfil'],[1344,804,72,72,'mentorina']];
const S=[
 ['landing',0,{pt:'Landing page',en:'Landing page',es:'Landing page'},'../img/edu/landing.webp',1440,7483,'edumentor.ai',[[80,634,241,60,'login'],[1062,28,97,49,'login'],[1180,30,180,46,'login'],[599*1+0,6371+516,242,61,'login']],true],
 ['login',1,{pt:'Login',en:'Log in',es:'Login'},'../img/edu/desk/d01-login.webp',1440,900,'edumentor.ai/entrar',[[802,626,440,48,'comecar']]],
 ['comecar',1,{pt:'Como começar',en:'How to start',es:'Cómo empezar'},'../img/edu/desk/d02-comecar.webp',1440,900,'edumentor.ai/primeiro-acesso',[[334,697,343,48,'nivel'],[765,625,341,48,'home']]],
 ['nivel',1,{pt:'Nivelamento',en:'Placement quiz',es:'Nivelación'},'../img/edu/desk/d03-nivel.webp',1440,900,'edumentor.ai/primeiro-acesso/nivelamento',[[918,675,220,48,'home'],[302,471,836,52,null]]],
 ['home',2,{pt:'Home',en:'Home',es:'Inicio'},'../img/edu/desk/d04-home.webp',1440,900,'edumentor.ai/inicio',[...SIDE,[684,416,248,48,'topico'],[288,636,357,112,'trilha'],[669,636,357,112,'simulados'],[1050,636,357,112,'redacao']]],
 ['trilha',2,{pt:'Trilha',en:'Study path',es:'Ruta'},'../img/edu/desk/d05-trilha.webp',1440,902,'edumentor.ai/trilha',[...SIDE,[1271,412,104,48,'topico'],[288,380,547,112,'topico']]],
 ['topico',2,{pt:'Tópico e questões',en:'Topic and questions',es:'Tema y preguntas'},'../img/edu/desk/d06-topico.webp',1440,900,'edumentor.ai/trilha/funcoes-1-grau',[...SIDE,[1155,608,221,48,'trilha'],[288,32,180,24,'trilha']]],
 ['mentorina',2,{pt:'Mentorina (chat)',en:'Mentorina (chat)',es:'Mentorina (chat)'},'../img/edu/desk/d07-mentorina.webp',1440,900,'edumentor.ai/mentorina',[...SIDE.slice(0,5),[1262,68,98,40,'topico']]],
 ['simulados',3,{pt:'Simulados',en:'Mock exams',es:'Simulacros'},'../img/edu/desk/d08-simulados.webp',1440,935,'edumentor.ai/simulados',[...SIDE.slice(0,5),[1344,839,72,72,'mentorina'],[320,393,293,48,'questao'],[701,393,293,48,'questao'],[1083,393,293,48,'questao']]],
 ['questao',3,{pt:'Questão do simulado',en:'Mock-exam question',es:'Pregunta del simulacro'},'../img/edu/desk/d09-questao.webp',1440,900,'edumentor.ai/simulados/mini-matematica',[[1207,14,185,48,'resultado'],[886,592,126,48,'resultado'],[40,20,72,36,'simulados']]],
 ['resultado',3,{pt:'Resultado',en:'Result',es:'Resultado'},'../img/edu/desk/d10-resultado.webp',1440,900,'edumentor.ai/simulados/resultado',[...SIDE,[571,694,219,48,'simulados'],[288,694,271,48,'simulados'],[1052,500,332,48,'trilha']]],
 ['redacao',3,{pt:'Redação',en:'Essay',es:'Redacción'},'../img/edu/desk/d11-redacao.webp',1440,920,'edumentor.ai/redacao',[[1164,14,228,48,'feedback'],[40,20,72,36,'home']]],
 ['feedback',3,{pt:'Correção da redação',en:'Essay feedback',es:'Corrección de la redacción'},'../img/edu/desk/d12-feedback.webp',1440,920,'edumentor.ai/redacao/correcao',[...SIDE.slice(0,5),[1344,824,72,72,'mentorina'],[288,794,236,48,'redacao'],[537,794,165,48,'redacao'],[1170,698,214,48,'mentorina']]],
 ['perfil',4,{pt:'Perfil',en:'Profile',es:'Perfil'},'../img/edu/desk/d13-perfil.webp',1440,1122,'edumentor.ai/perfil',[...SIDE.slice(0,5),[1344,1026,72,72,'mentorina'],[684,498,180,48,'trilha']]]
];
const byId=Object.fromEntries(S.map((s,i)=>[s[0],i]));
let cur=0;
const $=id=>document.getElementById(id);
$('lbl').textContent=T.lbl;$('hintBtn').textContent=T.hint;$('back').textContent=T.back;$('prev').textContent=T.prev;$('next').textContent=T.next;
const list=$('list');let g=-1;
S.forEach((s,i)=>{if(s[1]!==g){g=s[1];const p=document.createElement('p');p.textContent=T.g[g];list.appendChild(p)}const b=document.createElement('button');b.type='button';b.textContent=s[2][LANG];b.onclick=()=>go(i);list.appendChild(b)});
function go(i,focus){cur=Math.max(0,Math.min(S.length-1,i));const s=S[cur];
 const st=$('stage');st.innerHTML=`<img src="${s[3]}" alt="${T.alt}${s[2][LANG]}" width="${s[4]}" height="${s[5]}">`;
 s[7].forEach(([x,y,w,h,t])=>{if(!t)return;const b=document.createElement('button');b.type='button';b.className='hot';b.style.cssText=`left:${x/s[4]*100}%;top:${y/s[5]*100}%;width:${w/s[4]*100}%;height:${h/s[5]*100}%`;b.setAttribute('aria-label',S[byId[t]][2][LANG]);b.onclick=()=>go(byId[t]);st.appendChild(b)});
 $('view').classList.toggle('page',!!s[8]);$('view').scrollTop=0;
 $('url').textContent=s[6];
 [...list.querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-current',k===cur));
 $('prev').disabled=cur===0;$('next').disabled=cur===S.length-1;
 history.replaceState(null,'','#'+s[0]);}
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
$('hintBtn').onclick=()=>{const on=$('hintBtn').getAttribute('aria-pressed')!=='true';$('hintBtn').setAttribute('aria-pressed',on);$('stage').classList.toggle('hints',on)};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
// blink hints once on first click outside a hotspot
$('stage').addEventListener('click',e=>{if(e.target.classList.contains('hot'))return;const st=$('stage');st.classList.add('hints');const t=$('toast');t.textContent=T.tip;t.classList.add('on');setTimeout(()=>{if($('hintBtn').getAttribute('aria-pressed')!=='true')st.classList.remove('hints');t.classList.remove('on')},1400)});
const start=location.hash.slice(1);go(byId[start]??0);
</script>
</body>
</html>
