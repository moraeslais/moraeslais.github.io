<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EduMentor AI · Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#4F3CF0; --indigo-d:#3A29C9; --ink:#17152E; --lima:#C6F432; --coral:#FF6B57; --ciano:#3CC8F0;
  --lavanda:#E9E6FF; --lav-2:#F3F1FF; --bg:#F6F5FC; --card:#FFFFFF; --line:#D9D6EA; --line-s:#B9B5D3; --hair:#EFEDF7; --deep:#17152E; --indigo-t:#4F3CF0; --navbg:rgba(255,255,255,.96); --muted:#5E5B76; --muted-2:#6F6C8A;
  --ok:#137A51; --ok-bg:#E3F4EC; --err:#C42B30; --err-bg:#FCE7E7; --warn:#F2A516;
  --r-card:20px; --r-field:12px;
  --f-title:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Nunito Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:light;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#E7E5F3;font-family:var(--f-body);color:var(--ink)}
body{display:flex;flex-direction:column;justify-content:center;align-items:center}
#device{position:relative;width:100%;height:100dvh;display:flex;flex-direction:column}
#screen{position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#screen{color:var(--ink)}
#phone{position:relative;flex:1;min-height:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.sbar,.island,.hbar,.btns,.modes{display:none}

#device.theme-dark{color-scheme:dark;--bg:#0E0D18;--card:#1A1929;--ink:#F1EFFA;--muted:#ABA8C4;--muted-2:#827F9E;--lavanda:#29244D;--lav-2:#211E38;--line:#36334F;--line-s:#4D4A6B;--hair:#2A2840;
 --indigo-t:#A99EFF;--navbg:rgba(26,25,41,.94);--ok:#4BD69B;--ok-bg:#12332A;--err:#FF7B80;--err-bg:#3A1C24;--deep:#07060F}
.theme-dark .card.dark{box-shadow:inset 0 0 0 1px #2E2B48}
.theme-dark .card{box-shadow:none}
.theme-dark .opt.ok .let,.theme-dark .opt.bad .let{color:#0E0D18}
.theme-dark .btn.outline{border-color:var(--line-s)}
.theme-dark .btn[disabled]{background:#2C2945;color:#6E6B8A}
.theme-dark .btn.outline[disabled]{background:transparent;border-color:var(--line);color:#5A5775}
.theme-dark .mascot svg>path:first-child{opacity:.5}
.theme-dark .island{box-shadow:none}
@media (min-width:600px){
 body{background:radial-gradient(1200px 600px at 50% 0%,#F3F1FF 0%,#E4E1F4 60%,var(--line) 100%);gap:16px;padding:16px 0}
 .modes{display:inline-flex;gap:4px;background:#fff;border-radius:999px;padding:4px;box-shadow:0 4px 14px rgba(23,21,46,.08);flex:none}
 .modes button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font:700 14px var(--f-body);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
 .modes button[aria-pressed=true]{background:var(--deep);color:#fff}
 .modes button:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
 #device{flex:none;width:393px;height:852px;border-radius:58px;padding:12px;background:#0B0A14;
   box-shadow:0 0 0 2px #45434F,0 0 0 4px #1C1B24,0 40px 90px rgba(23,21,46,.35),inset 0 0 0 1px #2A2834}
 #device.ios{--st:54px;--sb:26px}
 #screen{border-radius:46px}
 .sbar{display:flex;position:absolute;left:0;right:0;top:0;height:54px;background:var(--bg);align-items:center;justify-content:space-between;padding:6px 30px 0 44px;z-index:40;pointer-events:none;color:var(--ink);font:600 16px/1 -apple-system,'SF Pro Text',system-ui,sans-serif;letter-spacing:-.01em}
 .sbar .r{display:flex;gap:6px;align-items:center}
 .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:41;pointer-events:none}
 .hbar{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--ink);z-index:41;pointer-events:none}
 .btns{display:block;position:absolute;inset:0;pointer-events:none}
 .btns i{position:absolute;width:4px;background:#2A2834;border-radius:2px}
 .ios .btns i:nth-child(1){left:-6px;top:150px;height:32px}
 .ios .btns i:nth-child(2){left:-6px;top:210px;height:62px}
 .ios .btns i:nth-child(3){left:-6px;top:285px;height:62px}
 .ios .btns i:nth-child(4){right:-6px;top:240px;height:96px}
 /* Android (Pixel-like) */
 #device.android{width:400px;height:868px;border-radius:44px;padding:10px;background:#16151C;--st:40px;--sb:16px;
   box-shadow:0 0 0 2px #5A5866,0 0 0 3px #26252E,0 40px 90px rgba(23,21,46,.35)}
 .android #screen{border-radius:34px}
 .android .sbar{height:40px;padding:4px 24px 0 26px;font:500 14px/1 Roboto,'Google Sans',system-ui,sans-serif}
 .android .island{top:14px;width:22px;height:22px;border-radius:50%;background:#000;box-shadow:0 0 0 2px #1d1c24}
 .android .hbar{width:108px;height:4px;bottom:6px;opacity:.85}
 .android .btns i:nth-child(1){right:-5px;top:170px;height:56px}
 .android .btns i:nth-child(2){right:-5px;top:260px;height:110px}
 .android .btns i:nth-child(3),.android .btns i:nth-child(4){display:none}
 .sbar .ios-only{display:flex;gap:6px;align-items:center}.sbar .and-only{display:none}
 .android .sbar .ios-only{display:none}.android .sbar .and-only{display:flex;gap:5px;align-items:center}
 .dark-top .sbar{color:#fff}
}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(var(--st) + 14px) 20px 28px;-webkit-overflow-scrolling:touch}
.has-nav .scroll{padding-bottom:110px}
h1{font-family:var(--f-title);font-weight:800;font-size:28px;line-height:1.08;letter-spacing:-.02em;margin:8px 0 8px}
h2{font-family:var(--f-title);font-weight:700;font-size:20px;margin:0 0 10px}
p{margin:0}
.sub{color:var(--muted);font-size:15px;line-height:1.45}
.small{font-size:13px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo-t)}
.mono{font-family:var(--f-mono)}
.card{background:var(--card);border-radius:var(--r-card);padding:16px;box-shadow:0 1px 0 rgba(23,21,46,.04),0 4px 14px rgba(23,21,46,.05)}
.card.lav{background:var(--lavanda);box-shadow:none}
.card.dark{background:var(--deep);color:#fff;box-shadow:none}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:999px;border:0;font:800 16px var(--f-body);cursor:pointer;transition:transform .15s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--indigo);color:#fff}
.btn.primary:hover{background:var(--indigo-d)}
.btn.outline{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}
.btn.soft{background:var(--lavanda);color:var(--ink)}
.btn[disabled]{background:#CFCBE6;color:#fff;cursor:not-allowed}
.btn.outline[disabled]{background:var(--card);border-color:var(--line);color:var(--line-s)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible,.navbtn:focus-visible,.link:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.link{background:none;border:0;color:var(--indigo-t);font:800 15px var(--f-body);cursor:pointer;padding:6px 0}
label.lbl{display:block;font-weight:800;font-size:15px;margin:16px 0 8px}
label.lbl span{font-weight:400;color:var(--muted)}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line-s);border-radius:var(--r-field);padding:0 14px;min-height:52px}
.field:focus-within{border-color:var(--indigo-t);box-shadow:0 0 0 3px rgba(79,60,240,.15)}
.field.error{border-color:var(--err)}
.field input{flex:1;border:0;outline:0;font:400 16px var(--f-body);background:transparent;color:var(--ink);min-width:0;padding:14px 0}
.field svg{flex:none;color:var(--muted)}
.errmsg{color:var(--err);font-size:13px;font-weight:700;margin-top:6px;display:flex;gap:6px;align-items:center}
.help{font-size:12px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two>*{min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--lavanda);border-radius:999px;padding:5px;margin:18px 0 22px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:44px;font:700 15px var(--f-body);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--indigo-t);box-shadow:0 2px 8px rgba(23,21,46,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-top:6px}
.auth{display:flex;flex-direction:column;padding-left:24px;padding-right:24px}
.auth-in{margin:auto 0}
.authtop{display:flex;justify-content:flex-end;height:0;position:relative;z-index:2}.authtop .iconbtn{width:40px;height:40px}
.auth .seg{margin:18px 0 16px}
.hero-m{display:flex;justify-content:center;margin:2px 0 -6px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}.iconbtn:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.qfoot{flex:none;padding:12px 20px calc(10px + var(--sb));background:var(--bg);border-top:1px solid var(--hair)}
.has-foot .scroll{padding-bottom:84px!important}.has-foot .fab{bottom:calc(118px + var(--sb))!important}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.otp input{height:56px;border:1.5px solid var(--line-s);border-radius:12px;background:var(--card);color:var(--ink);text-align:center;font:800 22px var(--f-mono);min-width:0}.otp input:focus{outline:none;border-color:var(--indigo-t);box-shadow:0 0 0 3px rgba(79,60,240,.15)}
.logo b{font-family:var(--f-title);font-size:24px;font-weight:800}
.aibadge{color:#17152E;background:var(--lima);font:800 11px var(--f-body);padding:2px 7px;border-radius:999px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.back{display:flex;align-items:center;gap:4px;background:none;border:0;font:800 16px var(--f-body);color:var(--ink);cursor:pointer;padding:8px 8px 8px 0;min-height:44px}
.step{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.prog{height:6px;background:var(--lavanda);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--indigo);border-radius:99px;transition:width .4s}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:7px 12px;font:800 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--indigo);border-color:var(--indigo-t);color:#fff}
.chip.lock{border-color:transparent;background:var(--lavanda);color:var(--muted);cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line-s);border-radius:var(--r-field);padding:12px 14px;min-height:52px;font:600 15px var(--f-body);color:var(--ink);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.opt .let{flex:none;width:28px;height:28px;border-radius:50%;background:var(--lav-2);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{background:var(--lavanda);border-color:var(--indigo-t)}
.opt.sel .let{background:var(--indigo);color:#fff}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .let{background:var(--ok);color:#fff}
.opt.bad{background:var(--err-bg);border-color:var(--err)}
.opt.bad .let{background:var(--err);color:#fff}
.opt[disabled]{cursor:default}
.opt .tag{display:block;font-size:12px;font-weight:800;margin-top:2px}
.opt .end{margin-left:auto}
.fb{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;animation:pop .3s ease-out}
.fb.ok{background:var(--ok-bg)} .fb.ok b{color:var(--ok)}
.fb.bad{background:var(--err-bg)} .fb.bad b{color:var(--err)}
@keyframes pop{0%{transform:scale(.94);opacity:0}70%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bar{height:8px;background:var(--lav-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + var(--sb));z-index:5}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;font:600 11px/1.2 var(--f-body);color:var(--muted);cursor:pointer;min-height:52px;padding:2px 0}
.navbtn .ic{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.navbtn .ic svg{width:22px;height:22px}
.navbtn.on{color:var(--indigo-t);font-weight:800}
.navbtn.on .ic{background:var(--lavanda)}
.has-nav .scroll{padding-bottom:calc(84px + var(--sb))}
.has-nav.has-fab .scroll{padding-bottom:calc(140px + var(--sb))}
.no-nav.has-fab .scroll{padding-bottom:calc(84px + var(--sb))}
.fab{position:absolute;right:16px;bottom:calc(74px + var(--sb));width:56px;height:56px;border-radius:50%;background:var(--indigo);border:0;color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(79,60,240,.32);cursor:pointer;z-index:6;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab{padding:0;background:none;overflow:visible}.fab .av{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 3px #fff}
.fab::after{content:"";position:absolute;top:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--lima);border:2px solid #fff}
.no-nav .fab{bottom:calc(16px + var(--sb))}
.coach{position:absolute;right:16px;max-width:240px;background:var(--deep);color:#fff;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.4;z-index:7;animation:pop .3s}
.coach::after{content:"";position:absolute;right:20px;bottom:-6px;width:12px;height:12px;background:var(--deep);transform:rotate(45deg)}
.acc{width:100%;background:none;border:0;padding:12px 0;text-align:left;cursor:pointer;font-family:var(--f-body);color:var(--ink);border-bottom:1px solid var(--hair)}
.acc:last-child{border-bottom:0}
.acc .det{display:none;margin-top:8px}
.acc[aria-expanded=true] .det{display:block}
.chev{transition:transform .2s;color:var(--muted);display:inline-flex}
.acc[aria-expanded=true] .chev{transform:rotate(90deg)}
.hscroll{display:flex;flex-wrap:wrap;gap:8px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.mascot{display:flex;justify-content:center;margin:4px 0 0}.mascot svg{display:block}
.av svg{display:block;width:100%;height:100%}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);font-size:15px}
.check:last-child{border-bottom:0}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-s);flex:none;display:grid;place-items:center}
.dot.done{background:var(--indigo);border-color:var(--indigo-t);color:#fff}
.dot.now{border-color:var(--indigo-t)} .dot.now::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--indigo)}
.check.later{color:var(--muted-2)}
.stepper{display:flex;align-items:center;justify-content:space-between}
.round{width:52px;height:52px;border-radius:50%;border:0;background:var(--lavanda);color:var(--indigo-t);font-size:26px;cursor:pointer;display:grid;place-items:center}
.days{display:flex;gap:8px;justify-content:space-between}
.day{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font:800 14px var(--f-body);cursor:pointer;color:var(--ink)}
.day.on{background:var(--indigo);border-color:var(--indigo-t);color:#fff}
.sel-row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line-s);border-radius:14px;padding:14px;font:800 15px var(--f-body);cursor:pointer;color:var(--ink);min-height:56px}
.sel-row.on{background:var(--lavanda);border-color:var(--indigo-t)}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-s);display:grid;place-items:center;flex:none;background:var(--card)}
.sel-row.on .box{background:var(--indigo);border-color:var(--indigo-t);color:#fff}
.pill-n{margin-left:auto;font-size:12px;border:1.5px solid var(--indigo);color:var(--indigo-t);border-radius:999px;padding:2px 8px}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-s);flex:none;display:grid;place-items:center;background:var(--card)}
.sel-row.on .radio{border-color:var(--indigo-t)} .sel-row.on .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--indigo)}
.module{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid transparent;border-radius:16px;padding:14px;text-align:left;cursor:pointer;font-family:var(--f-body);color:var(--ink);box-shadow:0 4px 14px rgba(23,21,46,.05)}
.module.cur{border-color:var(--indigo-t)}
.module.locked{opacity:.55;cursor:not-allowed}
.mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.module b{font-family:var(--f-title);font-size:16px;display:block}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;padding:11px 14px;border-radius:18px;font:400 15px/1.45 var(--f-body);animation:pop .25s ease-out}
.msg.me{align-self:flex-end;background:var(--indigo);color:#fff;border-bottom-right-radius:6px}
.mrow{display:flex;align-items:flex-end;gap:8px;max-width:86%;align-self:flex-start;animation:pop .25s ease-out}.mrow .av{flex:none;width:30px;height:30px}
.msg.me{max-width:80%}
.msg.ai{background:var(--card);border-bottom-left-radius:6px;box-shadow:0 2px 10px rgba(23,21,46,.06)}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted-2);margin-right:4px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer{display:flex;gap:10px;align-items:center;padding:10px 16px calc(10px + var(--sb));background:var(--bg)}
.composer .field{flex:1;border-radius:999px}
.send{width:44px;height:44px;border-radius:50%;background:var(--indigo);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.tplay{width:42px;height:42px;border-radius:50%;border:0;background:var(--lima);color:var(--deep);box-shadow:0 4px 12px rgba(166,209,26,.45);display:grid;place-items:center;cursor:pointer;flex:none}.tplay.on{background:var(--deep);color:#fff;box-shadow:none}.tplay svg{width:18px;height:18px}.tplay:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.timer.off{color:var(--muted);border-color:var(--line-s)}
.timer{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:12px;padding:6px 10px;font:700 20px var(--f-mono);background:var(--card)}
textarea{width:100%;min-height:220px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-card);padding:16px;font:400 16px/1.6 var(--f-body);color:var(--ink);resize:vertical;box-shadow:0 4px 14px rgba(23,21,46,.05)}
textarea:focus{outline:3px solid rgba(79,60,240,.35)}

function modOf(key){ return MODS.find(m=>m.topics.includes(key)); }
function tName(k){ return TOPICS[k]?TOPICS[k].title:k; }
function modDone(m){ return m.topics.filter(k=>S.done.includes(k)).length; }
function modState(m){ const i=MODS.indexOf(m); if(modDone(m)===m.topics.length) return 'done'; if(i===0||modDone(MODS[i-1])===MODS[i-1].topics.length) return 'cur'; return 'lock'; }
function nextTopic(){ for(const m of MODS){ if(modState(m)==='cur'){ const k=m.topics.find(k=>!S.done.includes(k)); return k; } } return null; }
function topicState(k){ if(S.done.includes(k)) return 'done'; return k===nextTopic()?'cur':'lock'; }
function mathPct(){ const all=MODS.flatMap(m=>m.topics); return Math.round(S.done.length/all.length*100); }

  if(!opts.replace && S.screen!==screen) S.history.push(S.screen);
  S.screen = screen; clearTimers(); render(); const sc = phone.querySelector('.scroll'); if(sc && !opts.keepScroll) sc.scrollTop = 0;

}

}
function fmt(sec){ sec=Math.max(0,sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

function mentorReply(txt){
  const t=txt.toLowerCase();
  if(/outro jeito|não entendi|nao entendi|explica|coeficiente|inclina/.test(t)) return 'Pensa numa rampa: quanto mais inclinada, maior o "a". Em f(x) = 2x + 1, a reta sobe 2 a cada 1 passo para a direita. Já o "b" (o 1) é a altura onde a reta começa, quando x = 0.';
  if(/exerc|treinar|quest/.test(t)) return 'Claro! Se f(x) = 3x − 2, quanto vale f(4)? Me responde aqui que eu confiro.';
  if(/^\s*10\s*$|vale 10|é 10|= ?10/.test(t)) return 'Isso mesmo! 3 · 4 − 2 = 10. Você está pegando o jeito.';
  if(/^\s*-?\d+([.,]\d+)?\s*$/.test(t)) return 'Quase! Troque o x por 4: 3 · 4 = 12, e 12 − 2 = 10. Quer tentar outro?';
  if(/dica|memoriz|decorar|lembrar/.test(t)) return 'Dica: "a" de ângulo (inclinação) e "b" de base (onde a reta corta o eixo y). ax + b: ângulo vezes x, mais a base.';
  if(/reda|texto|competên|competen/.test(t)) return 'Na redação, a competência 5 pede uma proposta de intervenção completa: quem age, o que faz, como faz, para quê e um detalhe. Quer que eu revise a sua?';
  if(/simulad|enem|prova/.test(t)) return 'Para o ENEM, vale treinar com tempo: cerca de 3 minutos por questão. Os simulados do app já vêm com cronômetro.';
  if(/obrigad|valeu|vlw/.test(t)) return 'De nada! Quando quiser, é só me chamar pelo botão roxo.';
  return `Boa pergunta! Em ${S.mentorCtx}, o mais importante é entender a ideia antes da fórmula. Pode me dar mais detalhes do que ficou confuso?`;
}

    inp.onpaste=e=>{ const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6); if(t){ e.preventDefault(); t.split('').forEach((c,k)=>ins[k]&&(ins[k].value=c)); $('#ok').disabled=val().length<6; } }; });
  setTimeout(()=>ins[0].focus(),50);
  const tick=()=>{ const left=30-Math.floor((Date.now()-S.reset.sent)/1000), r=$('#rs'); if(!r) return; r.innerHTML = left>0?`Reenviar código em 0:${String(left).padStart(2,'0')}`:`Não chegou? <button class="link" id="again" style="font-size:13px">Reenviar código</button>`; const a=$('#again'); if(a) a.onclick=()=>{ S.reset.sent=Date.now(); toast('Novo código enviado.'); tick(); }; };
  tick(); timers.push(setInterval(tick,1000));
  $('#ok').onclick=()=>go('novasenha'); };
V.novasenha = () => `<div class="scroll">${topbar('Voltar')}
  <h1 style="margin-top:12px">Crie uma nova senha</h1><p class="sub">Use uma senha que você não usa em outros sites.</p>
  <form id="f" novalidate><label class="lbl" for="pw">Nova senha</label><div class="field"><input id="pw" type="password" autocomplete="new-password" placeholder="••••••••"></div><div id="rules">${rulesHtml('')}</div>
  <label class="lbl" for="pw2">Confirmar nova senha</label><div class="field"><input id="pw2" type="password" autocomplete="new-password" placeholder="••••••••"></div><div id="err"></div>
  <button class="btn primary" style="margin-top:20px">Salvar nova senha</button></form></div>`;
V.novasenha.after = () => { $('#pw').oninput=e=>$('#rules').innerHTML=rulesHtml(e.target.value);
  $('#f').onsubmit=e=>{ e.preventDefault(); const p=$('#pw').value, p2=$('#pw2').value; let m='';
    if(!pwRules(p).every(r=>r[0])) m='A senha ainda não cumpre todos os requisitos.'; else if(p!==p2) m='As senhas não são iguais.';
    if(m){ $('#err').innerHTML=`<p class="errmsg">${I.info} ${m}</p>`; return; }
    S.history=[]; go('login',{replace:true}); setTimeout(()=>{ const em=$('#em'); if(em) em.value=S.reset.email||''; },0); toast('Senha alterada! Entre com a nova senha.'); }; };
V.senha = () => `<div class="scroll">${topbar('Perfil')}
  <h1 style="margin-top:12px">Alterar senha</h1><p class="sub">Por segurança, confirme a sua senha atual.</p>
  <form id="f" novalidate><label class="lbl" for="pa">Senha atual</label><div class="field"><input id="pa" type="password" autocomplete="current-password" placeholder="Sua senha atual"></div>
  <label class="lbl" for="pw">Nova senha</label><div class="field"><input id="pw" type="password" autocomplete="new-password" placeholder="••••••••"></div><div id="rules">${rulesHtml('')}</div>
  <label class="lbl" for="pw2">Confirmar nova senha</label><div class="field"><input id="pw2" type="password" autocomplete="new-password" placeholder="••••••••"></div><div id="err"></div>
  <button class="btn primary" style="margin-top:20px">Salvar</button></form>
  <div style="text-align:center;margin-top:8px"><button class="link" id="fg" style="font-size:14px">Esqueci minha senha atual</button></div></div>`;
V.senha.after = () => { $('#pw').oninput=e=>$('#rules').innerHTML=rulesHtml(e.target.value);
  $('#fg').onclick=()=>{ S.reset={email:S.email||'julia@email.com'}; go('esqueci'); };
  $('#f').onsubmit=e=>{ e.preventDefault(); const pa=$('#pa').value, p=$('#pw').value, p2=$('#pw2').value; let m='';
    if(!pa) m='Digite a sua senha atual.'; else if(!pwRules(p).every(r=>r[0])) m='A nova senha ainda não cumpre todos os requisitos.'; else if(p!==p2) m='As senhas não são iguais.'; else if(p===pa) m='A nova senha precisa ser diferente da atual.';
    if(m){ $('#err').innerHTML=`<p class="errmsg">${I.info} ${m}</p>`; return; } back(); toast('Senha alterada.'); }; };
const FAQ=[['Como a Mentorina monta a minha trilha?','Ela usa o seu curso-alvo, o resultado do nivelamento e a sua meta semanal. As áreas que mais pesam no seu curso vêm primeiro.'],['A nota da redação é oficial?','Não. É uma estimativa da IA com base nas 5 competências do ENEM. Se discordar, peça revisão na tela de feedback.'],['Posso mudar o meu curso depois?','Pode. Em Perfil > Curso-alvo. A trilha se reajusta na hora.'],['Por que algumas áreas estão bloqueadas?','Você estuda uma área por vez para não se perder. Dá para mudar a ordem em Perfil > Minha trilha.']];
V.suporte = () => `<div class="scroll">${topbar('Voltar')}
  <h1 style="margin-top:8px">Como podemos ajudar?</h1><p class="sub">Veja as dúvidas mais comuns ou fale com a nossa equipe.</p>
  <h2 style="margin-top:20px;font-size:18px">Dúvidas frequentes</h2>
  <div class="card" style="padding-top:4px;padding-bottom:4px">${FAQ.map(([q,a])=>`<button class="acc" aria-expanded="false"><span class="row between"><b style="font-size:15px;flex:1">${q}</b><span class="chev">${I.right}</span></span><span class="det"><span class="small" style="display:block;line-height:1.5">${a}</span></span></button>`).join('')}</div>
  <h2 style="margin-top:20px;font-size:18px">Falar com a equipe</h2>
  <form id="f" novalidate class="card">
   <p class="small" style="font-weight:800;color:var(--ink)">Assunto</p>
   <div class="chips" style="margin-top:8px" id="tp">${['Acesso à conta','Trilha','Simulados','Redação','Outro'].map(t=>`<button type="button" class="chip" data-tp="${t}" aria-pressed="false" style="text-transform:none;letter-spacing:0;font-size:13px">${t}</button>`).join('')}</div>
   <label class="lbl" for="msgx">Mensagem</label>
   <textarea id="msgx" style="min-height:110px;box-shadow:none" placeholder="Conte o que aconteceu"></textarea>
   <label class="lbl" for="em2">E-mail para resposta</label><div class="field"><input id="em2" type="email" value="${esc(S.email||'')}" placeholder="nome@email.com"></div>
   <div id="err"></div>
   <button class="btn primary" style="margin-top:16px">Enviar mensagem</button>
   <p class="help" style="text-align:center">Respondemos em até 24 horas úteis.</p>
  </form></div>`;
V.suporte.after = () => { let tp='';
  phone.querySelectorAll('.acc').forEach(b=>b.onclick=()=>b.setAttribute('aria-expanded', b.getAttribute('aria-expanded')!=='true'));
  phone.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{ tp=b.dataset.tp; phone.querySelectorAll('[data-tp]').forEach(x=>{ x.classList.toggle('on',x===b); x.setAttribute('aria-pressed',x===b); }); });
  $('#f').onsubmit=e=>{ e.preventDefault(); const er=[]; if(!tp) er.push('Escolha um assunto.'); if($('#msgx').value.trim().length<10) er.push('Escreva a mensagem (pelo menos 10 caracteres).'); if(!/^\S+@\S+\.\S+$/.test($('#em2').value.trim())) er.push('Informe um e-mail válido.');
    if(er.length){ $('#err').innerHTML=er.map(x=>`<p class="errmsg">${I.info} ${x}</p>`).join(''); return; } S.ticket={tp, email:$('#em2').value.trim()}; go('enviado',{replace:true}); }; };
V.enviado = () => `<div class="scroll auth"><div class="auth-in" style="text-align:center">${mascot(170,'comemorando')}
  <h1 style="margin-top:8px">Mensagem enviada!</h1><p class="sub">Assunto: ${esc(S.ticket.tp)}. Vamos responder em <b style="color:var(--ink)">${esc(S.ticket.email)}</b> em até 24 horas úteis.</p>
  <button class="btn primary" data-back style="margin-top:22px">Voltar</button></div></div>`;
V.tchau = () => `<div class="scroll auth"><div class="auth-in" style="text-align:center">${mascot(150,'acenando')}
  <h1 style="margin-top:8px">Conta encerrada</h1><p class="sub">Seus dados foram apagados. Se mudar de ideia, é só criar uma conta nova. Boa prova, ${esc(S.name)}!</p>
  <button class="btn primary" id="nw" style="margin-top:22px">Criar nova conta</button><button class="btn outline" id="lg" style="margin-top:10px">Ir para o login</button></div></div>`;
V.tchau.after = () => { S.history=[]; $('#nw').onclick=()=>go('cadastro',{replace:true}); $('#lg').onclick=()=>go('login',{replace:true}); };

/* ---------- render ---------- */
function render(){
  clearTimers();
  const v=V[S.screen]; const html=v();
  phone.className = (/class="nav"/.test(html) ? 'has-nav' : 'no-nav') + (/class="fab"/.test(html) ? ' has-fab' : '') + (/class="qfoot"/.test(html) ? ' has-foot' : '');
  phone.innerHTML = html;
  phone.querySelectorAll('[data-back]').forEach(b=>b.onclick=back);
  phone.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.history=[]; go(b.dataset.tab,{replace:true}); });
  phone.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ if(b.dataset.nav!==S.screen){ S.history=[]; go(b.dataset.nav); } });
  phone.querySelectorAll('[data-thq]').forEach(b=>b.onclick=()=>{ setTheme(isDark()?'light':'dark'); b.innerHTML=isDark()?I.sun:I.moon; b.setAttribute('aria-label',isDark()?'Ligar modo claro':'Ligar modo noturno'); });
  phone.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  phone.querySelectorAll('[data-fab]').forEach(b=>b.onclick=()=>openMentor(b.dataset.fab));
  v.after && v.after();
}
function start(){
  const h=(location.hash||'').slice(1);
  Object.assign(S,{history:[],chat:[],done:['r1','r2','r3','f0'],studied:15,edit:null,topicKey:'f1',essay:'',parts:['','','',''],part:0,essayStart:null,essayElapsed:0,fabTip:false});
  if(h==='home'){ Object.assign(S,{name:'Júlia',email:'julia@email.com',course:'Medicina',uni:'Universidade de São Paulo (USP)',path:'nivel',lang:'Inglês'}); S.screen='home'; }
  else { Object.assign(S,{name:'Júlia',email:'',course:'',uni:'',path:null,subjects:[],lang:''}); S.screen = h==='cadastro'?'cadastro':'login'; }
  render();
}
/* ---------- tema ---------- */
function getTheme(){ try{ return localStorage.getItem('em-theme')||'auto'; }catch(e){ return 'auto'; } }
function applyTheme(){ const t=getTheme(), dark = t==='dark' || (t==='auto' && matchMedia('(prefers-color-scheme: dark)').matches); document.getElementById('device').classList.toggle('theme-dark',dark); }
function isDark(){ return document.getElementById('device').classList.contains('theme-dark'); }
function themeBtn(){ return `<button class="iconbtn" data-thq aria-label="${isDark()?'Ligar modo claro':'Ligar modo noturno'}">${isDark()?I.sun:I.moon}</button>`; }
function setTheme(t){ try{ localStorage.setItem('em-theme',t); }catch(e){} S.theme=t; applyTheme(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
/* ---------- modo do aparelho ---------- */
(function(){
  const dev=document.getElementById('device');
  let mode='ios'; try{ mode = new URLSearchParams(location.search).get('device') || localStorage.getItem('em-device') || 'ios'; }catch(e){}
  const set=m=>{ mode = m==='android'?'android':'ios'; dev.classList.remove('ios','android'); dev.classList.add(mode); document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.dev===mode)); try{ localStorage.setItem('em-device',mode); }catch(e){} fit(); };
  const fit=()=>{ if(innerWidth<600){ dev.style.zoom=''; return; } const h=mode==='android'?868:852; const z=Math.min(1,(innerHeight-90)/h); dev.style.zoom = z<1? z.toFixed(3):''; };
  document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>set(b.dataset.dev));
  addEventListener('resize',fit); set(mode); applyTheme();
})();
window.addEventListener('hashchange', start);
start();
</script>
