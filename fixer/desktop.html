<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixer AI · Protótipo desktop</title>
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body>*{min-width:0}
html,body{margin:0;height:100%}
body{background:#111113;color:#F4F4F5;font:15px/1.5 Inter,system-ui,sans-serif;display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr;overflow:hidden}
:focus-visible{outline:3px solid #818CF8;outline-offset:2px;border-radius:8px}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid #27272A;flex-wrap:wrap}
header b{font:700 17px Outfit,Inter,sans-serif}
header .sp{flex:1}
header a,header button{color:#F4F4F5;background:#1F1F23;border:1px solid #3F3F46;border-radius:999px;padding:8px 14px;font:600 13px Inter;text-decoration:none;cursor:pointer}
header button[aria-pressed=true]{background:#818CF8;color:#0B0B12;border-color:#818CF8}
aside{overflow:auto;padding:14px 10px;border-right:1px solid #27272A}
aside p{font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:#A1A1AA;margin:14px 10px 6px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#D4D4D8;padding:8px 10px;border-radius:10px;font:500 14px Inter;cursor:pointer}
aside button:hover{background:#1F1F23}
aside button[aria-current=true]{background:#4F46E5;color:#fff}
main{position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:22px}
.browser{width:min(100%,calc((100vh - 150px) * 1.6));max-width:1280px;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.bar{display:flex;align-items:center;gap:8px;background:#27272A;padding:9px 12px}
.dark .bar{background:#2A1A47}
.bar i{width:11px;height:11px;border-radius:50%;background:#FF6B57}.bar i:nth-child(2){background:#F5C542}.bar i:nth-child(3){background:#3CC88A}
.bar span{margin-left:10px;flex:1;background:#18181B;border-radius:8px;padding:4px 12px;font:500 12px Inter;color:#A1A1AA}
.dark .bar span{background:#1B0F33;color:#B9A8DE}
.stage{position:relative;background:#F3EDFF}
.stage img{display:block;width:100%;height:auto}
.hot{position:absolute;border-radius:12px;cursor:pointer;background:transparent;border:0;padding:0}
.hints .hot{background:rgba(129,140,248,.30);outline:2px solid #818CF8;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(129,140,248,.08)}}
.nav{position:fixed;right:22px;bottom:18px;display:flex;gap:8px}
.nav button{background:#1F1F23;color:#fff;border:1px solid #3F3F46;border-radius:999px;padding:10px 16px;font:600 14px Inter;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#818CF8;color:#0B0B12;font:600 13px Inter;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
aside p.note{font:400 12px/1.45 Inter;letter-spacing:0;text-transform:none;color:#A1A1AA;margin:16px 10px 0}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #27272A;padding:8px}aside p,.note{display:none}aside button{width:auto;white-space:nowrap}.nav{position:static;justify-content:center;margin-top:14px}main{flex-direction:column;align-items:center}}
@media (prefers-reduced-motion:reduce){.hints .hot{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<header>
 <b>Fixer AI · <span id="tTitle"></span></b><span class="sp"></span>
 <button id="hintBtn" type="button" aria-pressed="false"></button>
 <a id="backLink" href="../case.html#case-fixer"></a>
</header>
<aside id="side" aria-label="Telas"></aside>
<main id="main">
 <div class="browser" id="browser"><div class="bar" aria-hidden="true"><i></i><i></i><i></i><span id="url"></span></div>
 <div class="stage" id="stage"><img id="img" alt="" width="1440" height="900"></div></div>
 <div class="nav"><button id="prev" type="button"></button><button id="next" type="button"></button></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
let LANG='pt';try{LANG=localStorage.getItem('lm-lang')||'pt'}catch(e){}
if(qs.get('lang'))LANG=qs.get('lang');if(!['pt','en','es'].includes(LANG))LANG='pt';
const T={
 pt:{title:'protótipo desktop',hint:'Mostrar áreas clicáveis',back:'← Voltar ao case',prev:'← Anterior',next:'Próxima →',tip:'Clique nas áreas destacadas para navegar',g:['Entrada','Chat','Histórico e conta'],note:'As telas estão em português, como no produto.'},
 en:{title:'desktop prototype',hint:'Show clickable areas',back:'← Back to the case',prev:'← Previous',next:'Next →',tip:'Click the highlighted areas to navigate',g:['Entry','Chat','History and account'],note:'Screens are in Portuguese, like the product.'},
 es:{title:'prototipo desktop',hint:'Mostrar áreas clicables',back:'← Volver al caso',prev:'← Anterior',next:'Siguiente →',tip:'Haz clic en las áreas destacadas para navegar',g:['Entrada','Chat','Historial y cuenta'],note:'Las pantallas están en portugués, como el producto.'}
}[LANG];
const SB=(first='analise')=>[[16,74,256,42,'busca'],[16,170,256,40,first],[16,212,256,40,'analise'],[16,292,256,40,'analise'],[16,334,256,40,'analise'],[16,376,256,40,'analise'],[16,418,256,40,'analise'],[16,760,256,44,'chat'],[16,820,214,64,'perfil'],[232,836,32,32,'login']];
const CARDS=[[504,425,232,166,'gerando'],[748,425,232,166,'gerando'],[992,425,232,166,'gerando'],[504,734,720,114,'gerando']];
const CHIPS=t=>[[504,637,147,38,t],[659,637,242,38,t],[909,637,178,38,t],[504,683,192,38,t]];
const L=(pt,en,es)=>({pt,en,es});
const S=[
 ['login',0,L('Login','Sign in','Entrar'),'f01','fixer.ai/login',[[96,579,448,44,'loginErro'],[346,650,90,24,'cadastro'],[432,533,112,22,'esqueci']]],
 ['loginErro',0,L('Login com erro','Sign-in error','Error al entrar'),'f02','fixer.ai/login',[[96,616,448,44,'chat'],[432,570,112,22,'esqueci'],[346,688,90,24,'cadastro']]],
 ['cadastro',0,L('Cadastro','Sign up','Registro'),'f03','fixer.ai/register',[[96,665,448,44,'cadastroErro'],[356,731,72,24,'login']]],
 ['cadastroErro',0,L('Cadastro com erros','Sign-up errors','Errores de registro'),'f04','fixer.ai/register',[[96,705,448,44,'primeiro'],[356,771,72,24,'login']]],
 ['esqueci',0,L('Esqueci a senha','Forgot password','Olvidé la contraseña'),'f05','fixer.ai/esqueci-senha',[[96,526,448,44,'link'],[245,597,150,24,'login']]],
 ['link',0,L('Link enviado','Link sent','Enlace enviado'),'f06','fixer.ai/esqueci-senha',[[96,577,448,46,'nova'],[245,650,150,24,'login']]],
 ['nova',0,L('Nova senha','New password','Nueva contraseña'),'f07','fixer.ai/nova-senha',[[96,576,448,44,'login'],[245,647,150,24,'login']]],
 ['primeiro',0,L('Primeiro acesso','First visit','Primer acceso'),'f08','fixer.ai/chat',[...CARDS,[16,760,256,44,'chat'],[16,820,214,64,'perfil']]],
 ['chat',1,L('Chat: início','Chat: start','Chat: inicio'),'f09','fixer.ai/chat',[...SB(),...CARDS]],
 ['gerando',1,L('Gerando resposta','Generating','Generando respuesta'),'f10','fixer.ai/chat',[...SB(),[504,173,720,342,'analise'],[1166,790,40,40,'erroIA']]],
 ['analise',1,L('Análise recebida','Analysis received','Análisis recibido'),'f11','fixer.ai/chat/post-cafe',[...SB('menu'),...CHIPS('refino'),[1166,790,40,40,'refino'],[529,468,670,140,'copiado']]],
 ['refino',1,L('Refinamento','Refinement','Refinamiento'),'f12','fixer.ai/chat/post-cafe',[...SB(),[1066,118,146,22,'analise'],...CHIPS('gerando')]],
 ['erroIA',1,L('Erro da IA','AI error','Error de la IA'),'f13','fixer.ai/chat',[...SB(),[529,292,185,46,'gerando']]],
 ['copiado',1,L('Prompt copiado','Prompt copied','Prompt copiado'),'f14','fixer.ai/chat/post-cafe',[...SB(),...CHIPS('refino')]],
 ['perfil',2,L('Perfil','Profile','Perfil'),'f15','fixer.ai/perfil',[...SB(),[1247,768,68,46,'login'],[552,648,103,46,'chat']]],
 ['carregando',2,L('Histórico carregando','History loading','Historial cargando'),'f16','fixer.ai/chat',[[16,150,256,310,'chat'],[16,760,256,44,'chat'],...CARDS]],
 ['busca',2,L('Busca com resultado','Search with results','Búsqueda con resultados'),'f17','fixer.ai/chat',[[16,172,256,38,'analise'],[238,84,26,24,'buscaVazia'],[16,760,256,44,'chat'],[16,820,214,64,'perfil']]],
 ['buscaVazia',2,L('Busca sem resultado','No search results','Búsqueda sin resultados'),'f18','fixer.ai/chat',[[238,84,26,24,'chat'],[16,760,256,44,'chat']]],
 ['menu',2,L('Menu do item','Item menu','Menú del elemento'),'f19','fixer.ai/chat/post-cafe',[[238,222,186,36,'renomear'],[238,262,186,36,'excluir'],[16,760,256,44,'chat']]],
 ['renomear',2,L('Renomear','Rename','Renombrar'),'f20','fixer.ai/chat/post-cafe',[[16,170,256,40,'analise']]],
 ['excluir',2,L('Confirmar exclusão','Confirm delete','Confirmar eliminación'),'f21','fixer.ai/chat/post-cafe',[[580,550,103,46,'analise'],[695,550,216,46,'erroExcluir']]],
 ['erroExcluir',2,L('Erro ao excluir','Delete error','Error al eliminar'),'f22','fixer.ai/chat/post-cafe',[...SB(),[1000,10,408,46,'analise']]],
 ['novoItem',2,L('Novo chat na lista','New chat in the list','Nuevo chat en la lista'),'f23','fixer.ai/chat',[...SB('chat'),...CARDS]]
];
const byId={};S.forEach((s,i)=>byId[s[0]]=i);
let cur=0;
document.documentElement.lang=LANG==='pt'?'pt-BR':LANG;
$('tTitle').textContent=T.title;$('hintBtn').textContent=T.hint;$('backLink').textContent=T.back;$('prev').textContent=T.prev;$('next').textContent=T.next;
function buildSide(){const a=$('side');a.innerHTML='';let g=-1;S.forEach((s,i)=>{if(s[1]!==g){g=s[1];const p=document.createElement('p');p.textContent=T.g[g];a.appendChild(p)}const b=document.createElement('button');b.type='button';b.textContent=`${String(i+1).padStart(2,'0')} · ${s[2][LANG]}`;b.onclick=()=>go(i);a.appendChild(b)});const n=document.createElement('p');n.className='note';n.textContent=T.note;a.appendChild(n)}
function go(i){cur=i;const s=S[i];const st=$('stage');st.querySelectorAll('.hot').forEach(h=>h.remove());
 const img=$('img');img.src=`../img/fixer/${s[3]}.webp`;img.alt=s[2][LANG];$('url').textContent=s[4];
 s[5].forEach(([x,y,w,h,t])=>{if(t===s[0]||byId[t]===undefined)return;const b=document.createElement('button');b.type='button';b.className='hot';b.style.cssText=`left:${x/14.4}%;top:${y/9}%;width:${w/14.4}%;height:${h/9}%`;b.setAttribute('aria-label',S[byId[t]][2][LANG]);b.onclick=()=>go(byId[t]);st.appendChild(b)});
 [...$('side').querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-current',k===i?'true':'false'));
 $('prev').disabled=i===0;$('next').disabled=i===S.length-1;$('main').scrollTop=0;
 try{history.replaceState(null,'','#'+s[0])}catch(e){}}
$('prev').onclick=()=>cur>0&&go(cur-1);$('next').onclick=()=>cur<S.length-1&&go(cur+1);
$('hintBtn').onclick=()=>{const on=$('hintBtn').getAttribute('aria-pressed')!=='true';$('hintBtn').setAttribute('aria-pressed',on);$('stage').classList.toggle('hints',on)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
$('stage').addEventListener('click',e=>{if(e.target.classList.contains('hot'))return;const st=$('stage');st.classList.add('hints');const t=$('toast');t.textContent=T.tip;t.classList.add('on');setTimeout(()=>{if($('hintBtn').getAttribute('aria-pressed')!=='true')st.classList.remove('hints');t.classList.remove('on')},1400)});
S.forEach(s=>{const i=new Image();i.src=`../img/fixer/${s[3]}.webp`});
document.body.classList.add('dark');$('stage').style.background='#18181B';
buildSide();go(Math.max(0,byId[location.hash.slice(1)]??0));
</script>
</body>
</html>
