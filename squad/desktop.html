<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squad · Protótipo web</title>
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body>*{min-width:0}
html,body{margin:0;height:100%}
body{background:#170B2C;color:#EEE8FB;font:15px/1.5 Inter,system-ui,sans-serif;display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr;overflow:hidden}
:focus-visible{outline:3px solid #FF9A3C;outline-offset:2px;border-radius:8px}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid #2E1D52;flex-wrap:wrap}
header b{font:700 17px Outfit,Inter,sans-serif}
header .sp{flex:1}
header a,header button{color:#EEE8FB;background:#26173F;border:1px solid #3E2A66;border-radius:999px;padding:8px 14px;font:600 13px Inter;text-decoration:none;cursor:pointer}
header button[aria-pressed=true]{background:#FF9A3C;color:#2A1300;border-color:#FF9A3C}
aside{overflow:auto;padding:14px 10px;border-right:1px solid #2E1D52}
aside p{font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:#A897CC;margin:14px 10px 6px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#D6CCEE;padding:8px 10px;border-radius:10px;font:500 14px Inter;cursor:pointer}
aside button:hover{background:#26173F}
aside button[aria-current=true]{background:#7C3AED;color:#fff}
main{position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:22px}
.browser{width:min(100%,calc((100vh - 150px) * 1.6));max-width:1280px;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.bar{display:flex;align-items:center;gap:8px;background:#EDE4FF;padding:9px 12px}
.dark .bar{background:#2A1A47}
.bar i{width:11px;height:11px;border-radius:50%;background:#FF6B57}.bar i:nth-child(2){background:#F5C542}.bar i:nth-child(3){background:#3CC88A}
.bar span{margin-left:10px;flex:1;background:#fff;border-radius:8px;padding:4px 12px;font:500 12px Inter;color:#5B4B80}
.dark .bar span{background:#1B0F33;color:#B9A8DE}
.stage{position:relative;background:#F3EDFF}
.stage img{display:block;width:100%;height:auto}
.hot{position:absolute;border-radius:12px;cursor:pointer;background:transparent;border:0;padding:0}
.hints .hot{background:rgba(255,154,60,.28);outline:2px solid #FF9A3C;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(255,154,60,.08)}}
.nav{position:fixed;right:22px;bottom:18px;display:flex;gap:8px}
.nav button{background:#26173F;color:#fff;border:1px solid #3E2A66;border-radius:999px;padding:10px 16px;font:600 14px Inter;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#FF9A3C;color:#2A1300;font:600 13px Inter;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
aside p.note{font:400 12px/1.45 Inter;letter-spacing:0;text-transform:none;color:#A897CC;margin:16px 10px 0}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #2E1D52;padding:8px}aside p,.note{display:none}aside button{width:auto;white-space:nowrap}.nav{position:static;justify-content:center;margin-top:14px}main{flex-direction:column;align-items:center}}
@media (prefers-reduced-motion:reduce){.hints .hot{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<header>
 <b>Squad · <span id="tTitle"></span></b><span class="sp"></span>
 <button id="themeBtn" type="button"></button>
 <button id="hintBtn" type="button" aria-pressed="false"></button>
 <a id="backLink" href="../case.html#case-squad"></a>
</header>
<aside id="side" aria-label="Telas"></aside>
<main id="main">
 <div class="browser" id="browser"><div class="bar" aria-hidden="true"><i></i><i></i><i></i><span id="url"></span></div>
 <div class="stage" id="stage"><img id="img" alt="" width="1440" height="900"></div></div>
 <div class="nav"><button id="prev" type="button"></button><button id="next" type="button"></button></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
let LANG='pt';try{LANG=localStorage.getItem('lm-lang')||'pt'}catch(e){}
if(qs.get('lang'))LANG=qs.get('lang');if(!['pt','en','es'].includes(LANG))LANG='pt';
let THEME='l';try{const t=qs.get('theme')||localStorage.getItem('lm-theme');if(t==='dark')THEME='d';else if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)THEME='d'}catch(e){}
const T={
 pt:{title:'protótipo web',hint:'Mostrar áreas clicáveis',back:'← Voltar ao case',prev:'← Anterior',next:'Próxima →',light:'☀ Modo claro',dark:'☾ Modo escuro',tip:'Toque nas áreas destacadas para navegar',g:['Entrada','App','Depois da partida'],note:'As telas estão em português, como no produto.'},
 en:{title:'web prototype',hint:'Show clickable areas',back:'← Back to the case',prev:'← Previous',next:'Next →',light:'☀ Light mode',dark:'☾ Dark mode',tip:'Tap the highlighted areas to navigate',g:['Entry','App','After the match'],note:'Screens are in Portuguese, like the product.'},
 es:{title:'prototipo web',hint:'Mostrar áreas clicables',back:'← Volver al caso',prev:'← Anterior',next:'Siguiente →',light:'☀ Modo claro',dark:'☾ Modo oscuro',tip:'Toca las áreas destacadas para navegar',g:['Entrada','App','Después de la partida'],note:'Las pantallas están en portugués, como el producto.'}
}[LANG];
// shared hotspots (px in the 1440×900 frame)
const RAIL=[[20,20,44,44,'home'],[16,90,52,52,'chat'],[16,354,52,52,'find']];
const SIDE=[[100,44,231,44,'home'],[100,92,231,44,'find'],[100,140,231,44,'chat'],[100,188,231,44,'profile'],[100,236,231,44,'safety'],[100,330,231,52,'chat']];
const S=[
 ['welcome',0,{pt:'Boas-vindas',en:'Welcome',es:'Bienvenida'},'l01','squad.gg',[[80,481,220,56,'login'],[312,481,200,56,'login'],[1250,22,110,44,'login']]],
 ['login',0,{pt:'Entrar',en:'Sign in',es:'Entrar'},'l02','squad.gg/entrar',[[810,619,440,52,'home'],[810,549,214,52,'home'],[1036,549,214,52,'home']]],
 ['home',1,{pt:'Início',en:'Home',es:'Inicio'},'l03','squad.gg/inicio',[...RAIL,...SIDE,[424,253,200,44,'find'],[950,346,90,26,'find'],[388,387,316,360,'detail'],[720,387,316,360,'detail'],[1060,195,340,208,'profile'],[1060,110,340,70,'safety']]],
 ['find',1,{pt:'Encontrar squad',en:'Find a squad',es:'Encontrar squad'},'l04','squad.gg/encontrar',[...RAIL,...SIDE,[388,230,326,330,'detail'],[730,230,326,306,'detail'],[1072,230,326,330,'detail'],[388,577,326,306,'detail'],[730,577,326,306,'detail'],[1072,577,326,306,'detail']]],
 ['detail',1,{pt:'Detalhe do squad',en:'Squad details',es:'Detalle del squad'},'l05','squad.gg/squad/so-minas-e-nb',[...RAIL,...SIDE,[388,26,160,26,'find'],[1060,414,320,54,'chat']]],
 ['chat',1,{pt:'Chat e call do squad',en:'Squad chat and call',es:'Chat y llamada del squad'},'l06','squad.gg/squad/ranqueada-tranquila/geral',[...RAIL,[1096,14,44,44,'safety'],[298,636,36,36,'match']]],
 ['match',2,{pt:'Fim de partida',en:'End of match',es:'Fin de la partida'},'l07','squad.gg/partida/avaliar',[...RAIL,...SIDE,[1020,596,380,52,'profile'],[1160,670,100,30,'home']]],
 ['profile',2,{pt:'Perfil e reputação',en:'Profile and reputation',es:'Perfil y reputación'},'l08','squad.gg/perfil',[...RAIL,...SIDE]],
 ['safety',2,{pt:'Central de segurança',en:'Safety center',es:'Centro de seguridad'},'l09','squad.gg/seguranca',[...RAIL,...SIDE]]
];
const byId={};S.forEach((s,i)=>byId[s[0]]=i);
let cur=0;
document.documentElement.lang=LANG==='pt'?'pt-BR':LANG;
$('tTitle').textContent=T.title;$('hintBtn').textContent=T.hint;$('backLink').textContent=T.back;$('prev').textContent=T.prev;$('next').textContent=T.next;
function paintTheme(){document.body.classList.toggle('dark',THEME==='d');$('themeBtn').textContent=THEME==='d'?T.light:T.dark;$('stage').style.background=THEME==='d'?'#1B0F33':'#F3EDFF'}
function buildSide(){const a=$('side');a.innerHTML='';let g=-1;S.forEach((s,i)=>{if(s[1]!==g){g=s[1];const p=document.createElement('p');p.textContent=T.g[g];a.appendChild(p)}const b=document.createElement('button');b.type='button';b.textContent=`${String(i+1).padStart(2,'0')} · ${s[2][LANG]}`;b.onclick=()=>go(i);a.appendChild(b)});const n=document.createElement('p');n.className='note';n.textContent=T.note;a.appendChild(n)}
function go(i){cur=i;const s=S[i];const st=$('stage');st.querySelectorAll('.hot').forEach(h=>h.remove());
 const img=$('img');img.src=`../img/squad/web/${THEME}${s[3].slice(1)}.webp`;img.alt=s[2][LANG];$('url').textContent=s[4];
 s[5].forEach(([x,y,w,h,t])=>{if(t===s[0])return;const b=document.createElement('button');b.type='button';b.className='hot';b.style.cssText=`left:${x/14.4}%;top:${y/9}%;width:${w/14.4}%;height:${h/9}%`;b.setAttribute('aria-label',S[byId[t]][2][LANG]);b.onclick=()=>go(byId[t]);st.appendChild(b)});
 [...$('side').querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-current',k===i?'true':'false'));
 $('prev').disabled=i===0;$('next').disabled=i===S.length-1;$('main').scrollTop=0;
 try{history.replaceState(null,'','#'+s[0])}catch(e){}}
$('prev').onclick=()=>cur>0&&go(cur-1);$('next').onclick=()=>cur<S.length-1&&go(cur+1);
$('themeBtn').onclick=()=>{THEME=THEME==='d'?'l':'d';paintTheme();go(cur)};
$('hintBtn').onclick=()=>{const on=$('hintBtn').getAttribute('aria-pressed')!=='true';$('hintBtn').setAttribute('aria-pressed',on);$('stage').classList.toggle('hints',on)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
$('stage').addEventListener('click',e=>{if(e.target.classList.contains('hot'))return;const st=$('stage');st.classList.add('hints');const t=$('toast');t.textContent=T.tip;t.classList.add('on');setTimeout(()=>{if($('hintBtn').getAttribute('aria-pressed')!=='true')st.classList.remove('hints');t.classList.remove('on')},1400)});
// preload both themes
S.forEach(s=>['l','d'].forEach(th=>{const i=new Image();i.src=`../img/squad/web/${th}${s[3].slice(1)}.webp`}));
paintTheme();buildSide();go(Math.max(0,byId[location.hash.slice(1)]??0));
</script>
</body>
</html>
