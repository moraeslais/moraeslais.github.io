<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venzi · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>:root{
--bg:#f4f7f6;--white:#fff;--subtle:#eef3f2;--bd:#dce4e2;--bd2:#c3cfcc;
--tx:#13201f;--mut:#56686a;--sub:#657174;--on:#fff;
--br:#0f766e;--brh:#0b5a54;--brs:#e2f2ef;--brt:#0b5a54;
--rh:#c2410c;--rhs:#fdebe1;--rht:#9a3412;--rm:#b7791f;--rms:#fbf1db;--rmt:#8a5a12;
--ok:#2f855a;--oks:#e3f4ea;--okt:#22663f;--ins:#e7eefb;--int:#2a4e9b;
--r-sm:6px;--r-md:10px;--r-lg:14px;
--fd:"Plus Jakarta Sans",Inter,system-ui,sans-serif;--fb:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fb);color:var(--tx);background:#dfe7e5;overflow:hidden;-webkit-font-smoothing:antialiased}
html.embed body{background:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}
#stage{position:absolute;left:50%;top:50%;transform-origin:center center;width:1440px}
/* barra do guia */
#guide{height:52px;margin-bottom:14px;display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;background:var(--tx);color:#fff;border-radius:14px}
#guide .gl{font:600 12px/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:#9fd9d1;white-space:nowrap}
#guide .gt{flex:1;font:500 14px/20px var(--fb);color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#guide .gt b{color:#9fd9d1;font-weight:600}
#guide .gb{height:36px;padding:0 14px;border-radius:10px;font:600 13px/1 var(--fb);background:rgba(255,255,255,.08);color:#fff;white-space:nowrap}
#guide .gb:hover{background:rgba(255,255,255,.16)}
#guide .gb.on{background:var(--br)}
html.embed #guide{border-radius:14px}
/* app */
.app{width:1440px;height:900px;display:flex;background:var(--bg);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(19,32,31,.18)}
html.embed .app{box-shadow:0 10px 40px rgba(19,32,31,.12)}
.side{width:248px;flex-shrink:0;background:var(--white);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:20px;padding:24px 16px 16px 16px}
.side .logo{padding-left:8px}
.clin{width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--subtle);border-radius:var(--r-md);padding:10px 12px}
.clin .t{flex:1}.clin b{display:block;font:600 14px/20px var(--fb)}.clin span{font:400 12px/16px var(--fb);color:var(--mut)}
.nav{display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);font:500 14px/20px var(--fb);color:var(--tx);text-align:left;width:100%}
.ni svg{color:var(--mut)}
.ni:hover{background:var(--bg)}
.ni.on{background:var(--brs);color:var(--brt);font-weight:600}.ni.on svg{color:var(--br)}
.ni .cnt{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--subtle);font:600 12px/20px var(--fb);text-align:center;color:var(--mut)}
.ni.on .cnt{background:var(--br);color:#fff}
.ni .lock{margin-left:auto;display:flex;align-items:center;gap:4px;font:500 11px/1 var(--fb);color:var(--sub)}.ni .lock svg{color:var(--sub)}
.side .sp{flex:1}
.user{display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--bd);text-align:left;width:100%;border-radius:0}
.user:hover{background:var(--bg)}
.user b{display:block;font:600 14px/20px var(--fb)}.user span{font:400 12px/16px var(--fb);color:var(--mut)}
.user .sw{margin-left:auto;font:500 11px/14px var(--fb);color:var(--brt);text-align:right}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px;padding:28px 32px;position:relative}
/* cabeçalho */
.hd{display:flex;align-items:center;gap:16px;flex-shrink:0}
.hd .ti{flex:1;min-width:0}
.hd .ey{font:400 13px/18px var(--fb);color:var(--mut)}
.hd .ey a{color:var(--mut);text-decoration:none;cursor:pointer}.hd .ey a:hover{color:var(--brt);text-decoration:underline}
.hd h1{font:700 28px/36px var(--fd);letter-spacing:-.01em}
.hd .sb{font:400 12px/16px var(--fb);color:var(--mut)}
.search{width:280px;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--white);color:var(--mut)}
.search input{border:0;outline:0;background:none;flex:1;font:400 14px/20px var(--fb);color:var(--tx);min-width:0}
.search input::placeholder{color:var(--sub)}
.iconbtn{width:40px;height:40px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--mut);position:relative}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--rh);border:2px solid #fff}
/* botões */
.btn{height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border-radius:var(--r-md);font:600 14px/20px var(--fb);white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn.p{background:var(--br);color:#fff}.btn.p:hover{background:var(--brh)}
.btn.s{background:var(--white);border:1px solid var(--bd2);color:var(--tx)}.btn.s:hover{background:var(--bg)}
.btn.g{color:var(--brt);padding:0 10px}.btn.g:hover{background:var(--brs)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
/* selos */
.selo{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font:500 12px/16px var(--fb);white-space:nowrap}
.selo i{width:6px;height:6px;border-radius:50%;background:currentColor}
.selo.alto{background:var(--rhs);color:var(--rht)}.selo.alto i{background:var(--rh)}
.selo.medio{background:var(--rms);color:var(--rmt)}.selo.medio i{background:var(--rm)}
.selo.ok{background:var(--oks);color:var(--okt)}.selo.ok i{background:var(--ok)}
.selo.sem{background:var(--subtle);color:var(--mut)}.selo.sem i{background:var(--bd2)}
.selo.chegou{background:var(--ins);color:var(--int)}
.selo.lista{background:var(--brs);color:var(--brt)}
.selo.feito{background:var(--oks);color:var(--okt)}
/* geral */
.av{width:32px;height:32px;border-radius:50%;background:var(--brs);color:var(--brt);font:600 12px/32px var(--fb);text-align:center;flex-shrink:0}
.av.sm{width:26px;height:26px;font-size:11px;line-height:26px}
.panel{background:var(--white);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ptl{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.ptl .t{flex:1;min-width:0}.ptl h2{font:700 18px/24px var(--fd)}.ptl h3{font:600 16px/22px var(--fd)}
.ptl p{font:400 12px/16px var(--fb);color:var(--mut)}
.scroll{overflow:auto;min-height:0;flex:1}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
.kpis{display:flex;gap:16px;flex-shrink:0}
.kpi{flex:1;background:var(--white);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font:500 13px/18px var(--fb);color:var(--mut)}
.kpi .v{font:700 30px/38px var(--fd);letter-spacing:-.01em}
.kpi .d{font:400 12px/16px var(--fb);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.alert{background:var(--rhs);border-color:var(--rh)}.kpi.alert .d{color:var(--rht)}
.cap{font:400 12px/16px var(--fb);color:var(--mut)}
.lab{font:600 11px/14px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.b14{font:600 14px/20px var(--fb)}
.t14{font:400 14px/20px var(--fb)}
.row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .nm{display:flex;align-items:center;gap:8px;font:600 14px/20px var(--fb)}
.link{cursor:pointer}.link:hover{color:var(--brt);text-decoration:underline}
.why{display:flex;align-items:flex-start;gap:6px;font:400 12px/16px var(--fb);margin-top:4px}
.why svg{margin-top:0}
.why.alto{color:var(--rht)}.why.medio{color:var(--rmt)}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid var(--bd);background:var(--white);font:400 14px/20px var(--fb)}
.chip span{font-size:12px;color:var(--mut)}
.chip.on{background:var(--brs);border-color:var(--brs);color:var(--brt);font-weight:600}.chip.on span{color:var(--brt)}
.fsel{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 12px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--white);font:600 14px/20px var(--fb);color:var(--tx)}
.fsel svg{color:var(--mut)}
.thead{display:flex;gap:16px;padding:10px 20px;background:var(--subtle)}
.thead div{font:600 11px/14px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:var(--r-md);background:var(--ins);color:var(--int);font:400 14px/20px var(--fb);flex-shrink:0}
.banner .t{flex:1}
.banner.ok{background:var(--oks);color:var(--okt)}
/* hoje */
.cols{display:flex;gap:24px;min-height:0;flex:1}
.done-row{opacity:.55}
.done-row .nm{text-decoration:line-through}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:44px 40px;text-align:center}
.empty .ic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.empty h3{font:700 18px/24px var(--fd)}
.empty p{font:400 14px/20px var(--fb);color:var(--mut);max-width:440px}
.wait{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--bd)}
.wait:last-child{border-bottom:0}
.next{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--bd)}
.next:last-child{border-bottom:0}
.next .h{width:44px;font:600 13px/18px var(--fb);color:var(--mut)}
/* agenda */
.agbar{display:flex;align-items:center;gap:12px;flex-shrink:0}
.seg{display:flex;gap:2px;padding:3px;background:var(--subtle);border-radius:var(--r-md)}
.seg button{height:30px;padding:0 14px;border-radius:var(--r-sm);font:400 14px/20px var(--fb);color:var(--mut)}
.seg button.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.legend{display:flex;gap:14px;margin-left:auto}
.legend span{display:flex;align-items:center;gap:6px;font:400 12px/16px var(--fb);color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px}
.grid{position:relative;flex:1;background:var(--white);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden}
.g-ln{position:absolute;height:1px;background:var(--bd)}
.g-ln.h{background:var(--subtle)}
.g-vl{position:absolute;top:0;bottom:0;width:1px;background:var(--bd)}
.g-hr{position:absolute;left:16px;font:400 12px/16px var(--fb);color:var(--mut)}
.g-pro{position:absolute;top:12px;display:flex;align-items:center;gap:10px}
.g-pro b{display:block;font:600 14px/20px var(--fb);white-space:nowrap}.g-pro span{font:400 12px/16px var(--fb);color:var(--mut)}
.g-lunch{position:absolute;background:var(--subtle)}
.g-now{position:absolute;height:2px;background:var(--rh)}
.g-nowd{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--rh)}
.ap{position:absolute;display:flex;align-items:stretch;gap:8px;border:1px solid var(--bd);border-radius:var(--r-sm);background:#fff;overflow:hidden;text-align:left;padding:0 8px 0 0;transition:box-shadow .15s,transform .1s}
.ap:hover{box-shadow:0 4px 14px rgba(19,32,31,.12);z-index:2}
.ap .bar{width:4px;flex-shrink:0}
.ap .tt{flex:1;min-width:0;padding-top:6px}
.ap .tt b{display:block;font:600 14px/20px var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .tt span{display:block;font:400 12px/16px var(--fb);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap.short .tt{padding-top:6px}.ap.short .tt span{color:var(--tx)}
.ap .pt{width:8px;height:8px;border-radius:50%;align-self:center;flex-shrink:0}
.ap.alto{background:var(--rhs);border-color:var(--rh)}
.ap.atend{background:var(--brs)}
.ap.sel{box-shadow:0 0 0 3px rgba(194,65,12,.35)}
.ap.vago{background:var(--brs);border:1px dashed var(--br);padding-left:10px;align-items:center}
.ap.vago span{font:500 12px/16px var(--fb);color:var(--brt)}
.ap.novo{background:var(--oks);border-color:var(--ok)}
/* drawer e modal */
.ov{position:absolute;inset:0;background:rgba(19,32,31,.35);z-index:20;animation:fade .15s}
.ov.light{background:rgba(19,32,31,.12)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:440px;background:#fff;z-index:21;box-shadow:-20px 0 50px rgba(13,38,38,.18);display:flex;flex-direction:column;animation:slide .2s ease-out}
.dsec{padding:20px 24px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:var(--r-lg);z-index:21;box-shadow:0 20px 50px rgba(13,38,38,.25);padding:28px;display:flex;flex-direction:column;gap:20px;animation:pop .18s ease-out}
.modal h2{font:700 20px/28px var(--fd)}
.modal .x{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:8px;color:var(--mut);font-size:18px}
.modal .x:hover{background:var(--bg)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:var(--r-md);text-align:left;color:var(--mut)}
.opt b{display:block;font:600 14px/20px var(--fb);color:var(--tx)}.opt span{font:400 12px/16px var(--fb);color:var(--mut)}
.opt:hover{border-color:var(--bd2)}
.opt.on{background:var(--brs);border-color:var(--br);box-shadow:inset 0 0 0 .5px var(--br);color:var(--br)}.opt.on b{color:var(--brt)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--bd);font:400 12px/16px var(--fb);background:#fff}
.pill.on{background:var(--br);border-color:var(--br);color:#fff}
.fld{display:flex;flex-direction:column;gap:6px;flex:1}
.fld label{font:400 12px/16px var(--fb);color:var(--mut)}
.inp{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border:1px solid var(--bd2);border-radius:var(--r-md);font:400 14px/20px var(--fb);background:#fff}
.inp input,.inp select{border:0;outline:0;background:none;flex:1;font:inherit;color:var(--tx);appearance:none;cursor:pointer}
.inp svg{color:var(--mut)}
textarea.ta{width:100%;height:64px;resize:none;border:1px solid var(--bd2);border-radius:var(--r-md);padding:10px 12px;font:400 14px/20px var(--fb);outline:0}
textarea.ta:focus,.inp:focus-within{border-color:var(--br);box-shadow:0 0 0 3px var(--brs)}
.check{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--bg);font:400 12px/16px var(--fb);text-align:left}
.check .bx{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.check.on .bx{background:var(--br);border-color:var(--br)}
.mfoot{display:flex;justify-content:flex-end;gap:10px}
.toast{position:absolute;left:calc(248px + (1192px / 2));bottom:28px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:var(--r-md);background:var(--tx);color:#fff;font:600 14px/20px var(--fb);box-shadow:0 8px 24px rgba(0,0,0,.18);animation:up .2s ease-out;white-space:nowrap}
.toast svg{color:#9fd9d1}
/* lista de espera */
.vagos{display:flex;gap:16px;flex-shrink:0}
.vg{flex:1;text-align:left;display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--bd);border-radius:var(--r-lg);background:#fff;min-width:0}
.vg:hover{border-color:var(--bd2)}
.vg.on{background:var(--brs);border:1.5px solid var(--br);padding:17.5px}
.vg.pode{border-style:dashed}
.vg.feito{background:var(--oks);border-color:var(--ok)}
.vg .top{display:flex;align-items:center}.vg .top .lab{flex:1}
.vg.on .lab,.vg.on .top .cap{color:var(--brt)}
.vg h3{font:700 18px/24px var(--fd)}
.vg .inf{display:flex;align-items:center;gap:6px;font:400 12px/16px var(--fb);color:var(--mut)}
.vg.pode .inf{color:var(--rmt)}
.vg.feito .inf{color:var(--okt)}
.cabe{height:20px;padding:0 8px;border-radius:999px;background:var(--brs);color:var(--brt);font:500 12px/20px var(--fb)}
.sug{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.sug .ok{display:flex;gap:8px;font:400 12px/16px var(--fb)}.sug .ok b{color:var(--okt);font-weight:600}
.await{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-md);background:var(--ins);color:var(--int);font:600 14px/20px var(--fb)}
/* indicadores */
.hm{display:grid;grid-template-columns:64px repeat(5,1fr);gap:6px;padding:0 20px 12px}
.hm .c{height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font:600 14px/20px var(--fb)}
.hm .d{font:400 12px/16px var(--fb);color:var(--mut);text-align:center}
.hm .p{font:400 12px/44px var(--fb);color:var(--mut)}
.bars{flex:1;display:flex;align-items:flex-end;gap:0;padding:28px 20px 10px;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bars .b i{width:36px;border-radius:4px 4px 0 0;display:block}
.bars .b span{font:400 12px/16px var(--fb);color:var(--mut)}
.tbar{width:120px;height:6px;border-radius:3px;background:var(--subtle);overflow:hidden}.tbar i{display:block;height:100%;border-radius:3px}
/* equipe */
.mx{display:grid;grid-template-columns:1fr 86px 86px 86px;align-items:center}
.mx>div{padding:10px 0;border-bottom:1px solid var(--bd);font:400 14px/20px var(--fb)}
.mx>div.c{text-align:center;display:flex;justify-content:center}
.yes{width:22px;height:22px;border-radius:50%;background:var(--oks);color:var(--okt);font:600 12px/22px var(--fb);text-align:center}
.no{color:var(--bd2)}
.only{height:20px;padding:0 8px;border-radius:999px;background:var(--subtle);color:var(--mut);font:400 12px/20px var(--fb)}
.pf{height:22px;padding:0 10px;border-radius:999px;font:400 12px/22px var(--fb);white-space:nowrap}
.pf.g{background:var(--brs);color:var(--brt)}.pf.r{background:var(--ins);color:var(--int)}.pf.p{background:var(--subtle);color:var(--tx)}
.locked{flex:1;display:flex;align-items:center;justify-content:center}
/* ficha */
.fator{display:flex;align-items:center;gap:12px}
.fator .w{display:flex;gap:3px}.fator .w i{width:14px;height:6px;border-radius:3px;background:var(--subtle)}
.fator .tx{flex:1;font:400 14px/20px var(--fb)}
.fator .lb{font:400 12px/16px var(--fb);color:var(--mut)}
.hist{display:flex;align-items:center;gap:16px;padding:9px 20px;border-bottom:1px solid var(--bd)}
.hist:last-child{border-bottom:0}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||!document.getElementById('stage').contains(t))return;const a=t.dataset.a;if(!A[a])return;if(t.disabled)return;A[a](t.dataset.k);render();});
const onIn=e=>{const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;
 if(k==='psearch'||k==='gsearch'){S.search=t.value;if(k==='gsearch'){S.scr='pac';S.drawer=null;}document.activeElementSel='psearch';render();}
 else if(k==='obs'&&S.modal)S.modal.obs=t.value;else if(k==='npac'&&S.modal){S.modal.pac=t.value;render();}else if(k==='npro'&&S.modal){S.modal.pro=+t.value;S.modal.hr=null;render();}else if(k==='cnome'&&S.modal)S.modal.nome=t.value;else if(k&&k.startsWith('m_')&&S.modal){S.modal[k.slice(2)]=t.value;if(t.tagName==='SELECT'||k==='m_nome'||k==='m_tel')renderKeep(k);}};
document.addEventListener('input',e=>{if(e.target.tagName!=='SELECT')onIn(e);});document.addEventListener('change',e=>{if(e.target.tagName==='SELECT')onIn(e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.modal||S.drawer)){S.modal=null;S.drawer=null;render();}});
function fit(){const st=document.getElementById('stage');const H=900+66,W=1440;const pad=document.documentElement.classList.contains('embed')?8:28;const s=Math.min((innerWidth-pad*2)/W,(innerHeight-pad*2)/H,1.25);st.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);
const qp=new URLSearchParams(location.search);if(qp.get('embed')==='1')document.documentElement.classList.add('embed');if(qp.get('flow'))S.flow=qp.get('flow');
fit();render();
